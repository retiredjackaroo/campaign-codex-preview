name: Build and Test

on:
  pull_request:
    branches:
      - v5
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: npm ci

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Check Continue the story cards
        run: npm run check:continue

      - name: Check duplicate page titles
        run: npm run check:titles

      - name: Check types and style
        run: npm run check

      - name: Test
        run: npm test

      - name: Build production site
        run: npm run build
      - name: Validate generated site
        run: npm run check:site
